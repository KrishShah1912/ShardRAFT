name: shardraft

x-storage-defaults: &storage-defaults
  image: shardraft:local
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  stop_grace_period: 15s
  networks:
    - shardraft
  healthcheck:
    test:
      - CMD
      - curl
      - --fail
      - --silent
      - --max-time
      - "2"
      - http://127.0.0.1:8080/status
    interval: 5s
    timeout: 3s
    retries: 5
    start_period: 10s

x-gateway-defaults: &gateway-defaults
  image: shardraft:local
  restart: unless-stopped
  stop_grace_period: 15s
  networks:
    - shardraft
  depends_on:
    n1:
      condition: service_healthy
    n2:
      condition: service_healthy
    n3:
      condition: service_healthy
    n4:
      condition: service_healthy
    n5:
      condition: service_healthy
  command:
    - shardraft-gateway
    - -http-addr=0.0.0.0:8085
    - -grpc-endpoints=n1:9090,n2:9090,n3:9090
    - -request-timeout=11s

services:
  n1:
    <<: *storage-defaults
    hostname: n1
    command:
      - shardraftd
      - -multi-raft
      - -id=1
      - -peers=2,3,4,5
      - -data-dir=/data
      - -raft-transport=grpc
      - -grpc-addr=n1:9090
      - -grpc-peer-addrs=2=n2:9090,3=n3:9090,4=n4:9090,5=n5:9090
      - -http-addr=0.0.0.0:8080
      - -election-timeout=15
      - -tick-interval=50ms
    volumes:
      - node1-data:/data
    ports:
      - "127.0.0.1:18081:8080"

  n2:
    <<: *storage-defaults
    hostname: n2
    command:
      - shardraftd
      - -multi-raft
      - -id=2
      - -peers=1,3,4,5
      - -data-dir=/data
      - -raft-transport=grpc
      - -grpc-addr=n2:9090
      - -grpc-peer-addrs=1=n1:9090,3=n3:9090,4=n4:9090,5=n5:9090
      - -http-addr=0.0.0.0:8080
      - -election-timeout=20
      - -tick-interval=50ms
    volumes:
      - node2-data:/data
    ports:
      - "127.0.0.1:18082:8080"

  n3:
    <<: *storage-defaults
    hostname: n3
    command:
      - shardraftd
      - -multi-raft
      - -id=3
      - -peers=1,2,4,5
      - -data-dir=/data
      - -raft-transport=grpc
      - -grpc-addr=n3:9090
      - -grpc-peer-addrs=1=n1:9090,2=n2:9090,4=n4:9090,5=n5:9090
      - -http-addr=0.0.0.0:8080
      - -election-timeout=25
      - -tick-interval=50ms
    volumes:
      - node3-data:/data
    ports:
      - "127.0.0.1:18083:8080"

  n4:
    <<: *storage-defaults
    hostname: n4
    command:
      - shardraftd
      - -multi-raft
      - -id=4
      - -peers=1,2,3,5
      - -data-dir=/data
      - -raft-transport=grpc
      - -grpc-addr=n4:9090
      - -grpc-peer-addrs=1=n1:9090,2=n2:9090,3=n3:9090,5=n5:9090
      - -http-addr=0.0.0.0:8080
      - -election-timeout=30
      - -tick-interval=50ms
    volumes:
      - node4-data:/data
    ports:
      - "127.0.0.1:18084:8080"

  n5:
    <<: *storage-defaults
    hostname: n5
    command:
      - shardraftd
      - -multi-raft
      - -id=5
      - -peers=1,2,3,4
      - -data-dir=/data
      - -raft-transport=grpc
      - -grpc-addr=n5:9090
      - -grpc-peer-addrs=1=n1:9090,2=n2:9090,3=n3:9090,4=n4:9090
      - -http-addr=0.0.0.0:8080
      - -election-timeout=35
      - -tick-interval=50ms
    volumes:
      - node5-data:/data
    ports:
      - "127.0.0.1:18085:8080"

  gateway1:
    <<: *gateway-defaults
    hostname: gateway1
    ports:
      - "127.0.0.1:18091:8085"

  gateway2:
    <<: *gateway-defaults
    hostname: gateway2
    ports:
      - "127.0.0.1:18092:8085"

networks:
  shardraft:
    driver: bridge

volumes:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
  node5-data:
