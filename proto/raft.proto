syntax = "proto3";

package shardraft.v1;

option go_package = "github.com/KrishShah1912/shardraft/proto;shardraftpb";

enum EntryType {
  ENTRY_NORMAL = 0;
  ENTRY_NOOP = 1;
}

enum MessageType {
  MSG_VOTE = 0;
  MSG_VOTE_RESP = 1;
  MSG_APPEND = 2;
  MSG_APPEND_RESP = 3;
  MSG_HEARTBEAT = 4;
  MSG_HEARTBEAT_RESP = 5;
}

message LogEntry {
  uint64 term = 1;
  uint64 index = 2;
  EntryType type = 3;
  bytes data = 4;
}

message RaftMessage {
  MessageType type = 1;

  uint64 from = 2;
  uint64 to = 3;

  uint64 term = 4;
  uint64 log_term = 5;
  uint64 index = 6;
  uint64 commit = 7;

  uint64 request_id = 8;

  repeated LogEntry entries = 9;
  bool reject = 10;
}

message StepRequest {
  uint64 shard_id = 1;
  RaftMessage message = 2;
}

message StepResponse {
  bool accepted = 1;
}

service RaftService {
  rpc Step(StepRequest) returns (StepResponse);
}
