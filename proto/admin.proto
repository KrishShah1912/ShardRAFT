syntax = "proto3";

package shardraft.v1;

option go_package = "github.com/KrishShah1912/shardraft/proto;shardraftpb";

enum NodeRole {
  NODE_ROLE_FOLLOWER = 0;
  NODE_ROLE_CANDIDATE = 1;
  NODE_ROLE_LEADER = 2;
}

message StatusRequest {
  uint64 shard_id = 1;
}

message StatusResponse {
  uint64 id = 1;
  NodeRole role = 2;
  uint64 term = 3;
  uint64 leader_id = 4;
  uint64 commit_index = 5;
  uint64 applied_index = 6;
  uint64 shard_id = 7;
}

message HealthRequest {}

message HealthResponse {
  bool healthy = 1;
  string message = 2;
}

service AdminService {
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}
