syntax = "proto3";

package shardraft.v1;

option go_package = "github.com/KrishShah1912/shardraft/proto;shardraftpb";

enum ErrorCode {
  ERROR_CODE_OK = 0;
  ERROR_CODE_NOT_LEADER = 1;
  ERROR_CODE_WRONG_SHARD = 2;
  ERROR_CODE_LEADER_UNAVAILABLE = 3;
  ERROR_CODE_OUTCOME_UNKNOWN = 4;
  ERROR_CODE_REQUEST_CONFLICT = 5;
  ERROR_CODE_INVALID_REQUEST = 6;
  ERROR_CODE_KEY_NOT_FOUND = 7;
  ERROR_CODE_INTERNAL = 8;
}

enum ReadMode {
  READ_MODE_LINEARIZABLE = 0;
  READ_MODE_LOCAL = 1;
}

message RoutingError {
  ErrorCode code = 1;
  string message = 2;
  uint64 leader_id = 3;
  string leader_address = 4;
  uint64 term = 5;
  uint64 shard_id = 6;
  uint64 epoch = 7;

  // True only when the request identity conflicts with
  // an already committed and applied command.
  bool conflict_committed = 8;
}

message RequestHeader {
  string client_id = 1;
  string request_id = 2;
  uint64 shard_id = 3;
  uint64 epoch = 4;
}

message GetRequest {
  RequestHeader header = 1;
  string key = 2;
  ReadMode read_mode = 3;
}

message GetResponse {
  string key = 1;
  string value = 2;
  bool found = 3;
  RoutingError error = 4;
}

message PutRequest {
  RequestHeader header = 1;
  string key = 2;
  string value = 3;
}

message DeleteRequest {
  RequestHeader header = 1;
  string key = 2;
}

message CompareAndSwapRequest {
  RequestHeader header = 1;
  string key = 2;
  string expected = 3;
  string value = 4;
}

message MutationResponse {
  bool applied = 1;
  string value = 2;
  RoutingError error = 3;
}

service KVService {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (MutationResponse);
  rpc Delete(DeleteRequest) returns (MutationResponse);
  rpc CompareAndSwap(CompareAndSwapRequest)
      returns (MutationResponse);
}
