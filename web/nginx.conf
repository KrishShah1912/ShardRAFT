server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /multi/node1/ {
        proxy_pass http://n1:8080/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /multi/node2/ {
        proxy_pass http://n2:8080/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /multi/node3/ {
        proxy_pass http://n3:8080/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /multi/node4/ {
        proxy_pass http://n4:8080/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /multi/node5/ {
        proxy_pass http://n5:8080/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /multi/gateway1/ {
        proxy_pass http://gateway1:8085/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /multi/gateway2/ {
        proxy_pass http://gateway2:8085/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
